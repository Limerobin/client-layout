name: Build ClientLayout

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile ClientLayout.exe
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /win32manifest:"${{ github.workspace }}\app.manifest" /out:"${{ github.workspace }}\ClientLayout.exe" /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Runtime.Serialization.dll "${{ github.workspace }}\ClientLayout.cs"

      - name: Upload ClientLayout.exe
        uses: actions/upload-artifact@v4
        with:
          name: ClientLayout
          path: ${{ github.workspace }}\ClientLayout.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            `ClientLayout.exe` built from `${{ github.sha }}`.

            Download **ClientLayout.exe** below, put it next to your game (or anywhere), and start it.
          files: ${{ github.workspace }}\ClientLayout.exe
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
